[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "flote"
version = "1.0.0"
requires-python = ">=3.10"
description = "Flote is a HDL and Python framework for simulation. Designed to be friendly, simple, and productive. Easy to use and learn."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "flote.simulation.fpga"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
maturin = "^1.10.2"
mkdocs-material = "^9.7.0"
pytest = "^9.0.2"
black = "^26.3.1"
isort = "^8.0.1"
flake8 = "^7.3.0"
pre-commit = "^4.5.1"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
