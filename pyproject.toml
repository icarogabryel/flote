[project]
name = "flote"
version = "1.0.0"
requires-python = ">=3.10"
description = "Flote is a HDL and Python framework for simulation. Designed to be friendly, simple, and productive. Easy to use and learn."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "mkdocs-material>=9.7.6",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "flote.simulation.fpga"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
